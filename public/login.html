<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Code to Learn Java</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        nav {
            background: #172554;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #facc15;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        nav ul li a:hover {
            color: #facc15;
        }

        /* Login Section */
        .login-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-box {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .login-box h1 {
            text-align: center;
            color: #172554;
            margin-bottom: 10px;
        }

        .login-box .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #172554;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #2563eb;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .forgot {
            text-align: right;
            margin-top: 12px;
        }

        .forgot a {
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
        }

        .signup {
            text-align: center;
            margin-top: 25px;
            color: #64748b;
        }

        .signup a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        /* Footer */
        footer {
            background: #172554;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            nav {
                flex-direction: column;
                gap: 15px;
            }

            nav ul {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .login-box {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav>
        <div class="logo">
            Code to <span>Learn</span> - Java
        </div>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="learn.html">Learn</a></li>
            <li><a href="practice.html">Practice</a></li>
            <li><a href="quiz.html">Quiz</a></li>
        </ul>
    </nav>

    <!-- Login -->
    <section class="login-section">

        <div class="login-box">

            <h1>Welcome Back 👋</h1>
            <p class="subtitle">Login to continue learning Java</p>

            <form id="loginForm">

                <div class="input-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="login-btn">
                    Login
                </button>

                <div class="forgot">
                    <a href="#">Forgot Password?</a>
                </div>

                <div id="message" class="message"></div>

            </form>

            <div class="signup">
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </div>

        </div>

    </section>

    <!-- Footer -->
    <footer>
        © 2026 Code to Learn - Java | Learn. Practice. Succeed.
    </footer>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const message = document.getElementById("message");

            if (email && password) {
                message.style.color = "green";
                message.textContent = "Login successful!";

                // Temporary frontend login
                setTimeout(function() {
                    window.location.href = "index.html";
                }, 1000);
            } else {
                message.style.color = "red";
                message.textContent = "Please enter all details.";
            }
        });
    </script>

</body>
</html>
